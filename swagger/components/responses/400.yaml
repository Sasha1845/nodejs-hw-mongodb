description: Bad Request - validation error or invalid data
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: 'Name must be at least 3 characters long'
        data:
          type: string
          example: 'Name must be at least 3 characters long'
