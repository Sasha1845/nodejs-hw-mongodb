openapi: 3.1.0
info:
  version: 1.0.0
  title: Contact Manager API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: A RESTful API for managing user contacts with authentication, password reset functionality, and photo upload capabilities. Users can register, login, manage their contacts with CRUD operations, and upload contact photos to Cloudinary.
tags:
  - name: Contacts
    description: Contact management endpoints for CRUD operations
servers:
  - url: https://nodejs-hw-mongodb-ti7h.onrender.com
paths:
  /contacts:
    get:
      $ref: '../swagger/paths/contacts/get.yaml'
    post:
      $ref: '../swagger/paths/contacts/post.yaml'
  /contacts/{contactId}:
    get:
      $ref: '../swagger/paths/contacts/{contactId}/get.yaml'
    patch:
      $ref: '../swagger/paths/contacts/{contactId}/patch.yaml'
    delete:
      $ref: '../swagger/paths/contacts/{contactId}/delete.yaml'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
